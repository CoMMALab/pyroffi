[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroffi"
version = "0.2.0"
description = "Python Robot Kinematics Library with Accelerated Foreign Kinematics Kernels"
readme = "README.md"
license = { text="MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "tyro==1.0.15",
    "jax==0.10.2",
    "jaxlib==0.10.2",
    "jaxlie==1.5.0",
    "jax_dataclasses==1.6.3",
    "jaxtyping==0.3.11",
    "loguru==0.7.3",
    "robot_descriptions==3.0.0",
    "yourdfpy==0.0.60",
    "trimesh==4.12.2",
    "viser==1.0.30",
    "pyliblzfse==0.4.1", # Need for viser.extras import in viser==0.2.23
    "flax==0.12.7",
    "numpy==2.3.4",
    "scipy==1.16.3",
    "termcolor==3.2.0",
    "typing_extensions==4.15.0",
]

[project.optional-dependencies]
# GRiD-based CUDA dynamics codegen (pyroffi.dynamics.GRiDDynamics); also
# requires nvcc and the external/GRiD checkout (A2R-Lab/GRiD, which supplies
# the `grid_codegen` package) on disk.  Its URDFParser object model is vendored
# into pyroffi.dynamics._grid_urdf, so that submodule is not needed. sympy powers the URDF->GRiD symbolic codegen. (scipy is a
# core dependency, used by the URDF->GRiD adapter and collision geometry.)
dynamics = [
    "sympy>=1.7.1",
]
# Mesh <-> primitive conversion helpers (pyroffi.collision geometry, Robot mesh
# loading) lazily import MuJoCo; only needed if you use those code paths.
mesh = [
    "mujoco==3.10.0",
]
# CUDA 13 GPU backend for JAX (the accelerated FK/IK/collision kernels). The
# base install is CPU-only; `pip install pyroffi[cuda]` pulls the pjrt/plugin.
cuda = [
    "jax-cuda13-plugin==0.10.2",
    "jax-cuda13-pjrt==0.10.2",
]
# MCP server exposing the pyroffi.toolbox primitives over stdio
# (pyroffi.mcp / the `pyroffi-mcp` script). The toolbox layer itself has no new
# dependencies -- only the transport adapter needs `mcp`.
mcp = [
    "mcp>=1.2.0",
]
# Execution sandbox: a stepped MuJoCo world with a viser render layer, exposed
# over MCP by `pyroffi-sandbox`. Deliberately a separate extra from `mcp`,
# because it is a separate adapter: that server computes, this one acts.
sandbox = [
    "mcp>=1.2.0",
    "mujoco>=3.2",
    "robot_descriptions",
    "viser",
    "imageio",
]
dev = [
    "pyright>=1.1.308",
    "scikit-sparse",
    "ruff",
    "pytest",
    "m2r2",
]

[project.scripts]
pyroffi-mcp = "pyroffi.mcp._server:main"
pyroffi-sandbox = "pyroffi.sandbox._server:main"

[tool.pytest.ini_options]
markers = [
    "slow: tests that build an extra session or pay a large compile",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors.
    "F",  # Pyflakes rules.
    "PLC",  # Pylint convention warnings.
    "PLE",  # Pylint errors.
    "PLR",  # Pylint refactor recommendations.
    "PLW",  # Pylint warnings.
]
ignore = [
    "E731",  # Do not assign a lambda expression, use a def.
    "E741", # Ambiguous variable name. (l, O, or I)
    "E501",  # Line too long.
    "E721",  # Do not compare types, use `isinstance()`.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "PLR2004",  # Magic value used in comparison.
    "PLR0915",  # Too many statements.
    "PLR0913",  # Too many arguments.
    "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
    "PLC1901",  # Use falsey strings.
    "PLR5501",  # Use `elif` instead of `else if`.
    "PLR0911",  # Too many return statements.
    "PLR0912",  # Too many branches.
    "PLW0603",  # Globa statement updates are discouraged.
    "PLW2901",  # For loop variable overwritten.
]
